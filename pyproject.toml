[project]
name = "rag5060"
version = "0.1.0"
description = "Local RAG MVP for RTX 5060 Ti 16GB"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0,<0.116",
  "uvicorn[standard]>=0.32.0,<0.33",
  "pydantic>=2.9.0,<3",
  "pydantic-settings>=2.6.0,<3",
  "sqlalchemy[asyncio]>=2.0.36,<2.1",
  "asyncpg>=0.30.0,<0.31",
  "alembic>=1.14.0,<1.15",
  "psycopg[binary]>=3.2.0,<3.3",
  "httpx==0.27.2",
  "structlog>=24.4.0,<25",
  "python-multipart>=0.0.12,<0.1",
  "passlib[bcrypt]>=1.7.4,<2",
  "bcrypt>=4.0.0,<4.1",
  "itsdangerous>=2.2.0,<3",
  "pypdf>=5.1.0,<6",
  "qdrant-client==1.12.2",
  "redis==5.2.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0,<9",
  "pytest-asyncio>=0.24.0,<0.25",
  "ruff>=0.8.0,<0.9",
]
worker = [
  "celery[redis]>=5.4.0,<5.5",
]
embeddings = [
  "sentence-transformers>=3.3.0,<4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "modules*", "rag*"]
