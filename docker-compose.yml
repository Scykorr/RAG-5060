# Core profile for local RAG (WSL2 Docker Engine on D: VHDX).
# Do not publish DB/Valkey/Qdrant/Ollama to the LAN.
name: rag5060

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16.6-alpine
    profiles: ["core"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-rag}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 1g
    restart: unless-stopped
    logging: *default-logging
    networks: [internal]

  valkey:
    image: valkey/valkey:8.0.2-alpine
    profiles: ["core"]
    command: ["valkey-server", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - valkeydata:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 256m
    restart: unless-stopped
    logging: *default-logging
    networks: [internal]

  qdrant:
    image: qdrant/qdrant:v1.13.2
    profiles: ["core"]
    volumes:
      - qdrantdata:/qdrant/storage
    environment:
      QDRANT__STORAGE__ON_DISK_PAYLOAD: "true"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 15s
      timeout: 5s
      retries: 10
    mem_limit: 2g
    restart: unless-stopped
    logging: *default-logging
    networks: [internal]

  ollama:
    image: ollama/ollama:0.12.6
    profiles: ["core"]
    gpus: all
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_CONTEXT_LENGTH: "4096"
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_KEEP_ALIVE: "30m"
    volumes:
      - ollamadata:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
    mem_limit: 3g
    restart: unless-stopped
    logging: *default-logging
    networks: [internal]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    profiles: ["core"]
    env_file: [.env]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      VALKEY_URL: ${VALKEY_URL:-redis://valkey:6379/0}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
      DATA_ROOT: ${DATA_ROOT:-/var/lib/rag}
      IMPORT_INBOX: ${IMPORT_INBOX:-/var/lib/rag/inbox}
      IMPORT_INBOX_HOST_HINT: ${IMPORT_INBOX_HOST_HINT:-D:/RAG5060/inbox}
      ADMIN_LOGIN: ${ADMIN_LOGIN:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
    volumes:
      - ragdata:/var/lib/rag
      # Host folder for bulk import (put PDF/DOCX/TXT here, then Import folder in UI)
      - ${IMPORT_INBOX_HOST:-/mnt/d/RAG5060/inbox}:/var/lib/rag/inbox
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      # Do not block API/login on Ollama GPU health — chat can wait; login must be fast
      ollama:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    mem_limit: 1g
    restart: unless-stopped
    logging: *default-logging
    networks: [internal]

  nginx:
    image: nginx:1.27-alpine
    profiles: ["core"]
    ports:
      # Host 18080 (not 8080). Bind 0.0.0.0 so Windows→WSL localhost forwarding works after WSL flaps;
      # 127.0.0.1-only publish often becomes unreachable from the Windows browser.
      - "${RAG_UI_PORT:-18080}:8080"
    volumes:
      - ./configs/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./apps/web:/usr/share/nginx/html:ro
    depends_on:
      api:
        # UI only after API accepts traffic — avoids login against dying/restarting API
        condition: service_healthy
    mem_limit: 128m
    restart: unless-stopped
    logging: *default-logging
    networks: [internal]

networks:
  internal:
    driver: bridge
    internal: false

volumes:
  pgdata:
  valkeydata:
  qdrantdata:
  ollamadata:
  ragdata:
